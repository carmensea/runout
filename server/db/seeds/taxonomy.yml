# Runout's genre taxonomy (docs/backend-plan.md §6, docs/milestone-4-plan.md §3).
#
# Applied by `bin/rails taxonomy:seed`, idempotently by slug and tag. Rows the owner has edited
# (origin `manual`) are never overwritten; seed mappings removed from this file are removed.
#
# - `broad`: the broad genres. `tags` are provider names that mean the broad genre itself; their
#   weight shows as "Other <genre>" in the subgenre view.
# - `subgenres`: each has one parent. `tags` are provider genre or tag names (lower case, as
#   MusicBrainz writes its genres). A name's weight goes to the subgenre, except the part `also`
#   sends to other broad genres: `also: { rock: 0.5 }` gives half to Rock and half to the subgenre.
# - Names not listed are kept, unmapped, and listed by `bin/rails taxonomy:unmapped`.
version: 1

settings:
  # docs/backend-plan.md §6: tags below this weight (strongest tag = 100) are ignored, and an item
  # whose mapped weight is below `min_mapped_weight` is Unclassified.
  min_tag_weight: 10
  min_mapped_weight: 10

broad:
  - { slug: rock, name: Rock, tags: [rock, rock and roll, rock & roll] }
  - { slug: indie-alternative, name: Indie & alternative, tags: [indie, alternative, alternative rock] }
  - { slug: pop, name: Pop, tags: [pop] }
