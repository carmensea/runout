# Development and test use a local PostgreSQL (see server/README.md).
# Production uses Railway's PostgreSQL; see docs/railway-deployment.md.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DATABASE_PORT") { 5432 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { "postgres" } %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  # The local server doesn't use GSSAPI. Skipping the negotiation also avoids a libpq crash in
  # forked processes on macOS (parallel tests).
  gssencmode: disable

# A supervised local import (docs/real-import-runbook.md) runs Solid Queue on its own database:
# set QUEUE_DATABASE_URL to use it. Without it, development is a single database, as before.
development:
<% if ENV["QUEUE_DATABASE_URL"].present? %>
  primary:
    <<: *default
    database: runout_development
  queue:
    <<: *default
    url: <%= ENV["QUEUE_DATABASE_URL"] %>
    migrations_paths: db/queue_migrate
<% else %>
  <<: *default
  database: runout_development
<% end %>

test:
  <<: *default
  database: runout_test

# Railway gives one DATABASE_URL over its private network. Solid Queue has its own database on the
# same server, so backing up or restoring the archive never touches queue state.
production:
  primary:
    adapter: postgresql
    url: <%= ENV["DATABASE_URL"] %>
    max_connections: <%= pool = ENV.fetch("RAILS_MAX_THREADS", 3).to_i + ENV.fetch("JOB_THREADS", 2).to_i %>
  queue:
    adapter: postgresql
    url: <%= ENV["QUEUE_DATABASE_URL"].presence || (ENV["DATABASE_URL"].present? ? URI(ENV["DATABASE_URL"]).tap { |u| u.path = "/runout_queue" }.to_s : nil) %>
    # In-process Solid Queue: job threads plus the dispatcher, scheduler, poller and heartbeats.
    max_connections: <%= pool + 6 %>
    migrations_paths: db/queue_migrate
