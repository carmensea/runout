# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  # Import recovery: expired leases, abandoned staging, stalled runs (HistoryImport::Recovery).
  # Does nothing that writes history, and schedules no import work while history storage is off.
  import_watchdog:
    class: ImportWatchdogJob
    queue: default
    schedule: every 10 minutes
  # Ongoing synchronisation (HistoryImport::Sync): starts the sync, catch-up or weekly count
  # comparison that is due for each user. How often each is due: config.x.history_sync.
  # Does nothing while history storage is off.
  history_sync:
    class: SyncScheduleJob
    queue: default
    schedule: <%= ENV.fetch("SYNC_SCHEDULE", "every 30 minutes") %>
  # Measures the plays present per period for the status endpoint's discrepancy check
  # (HistoryImport::CountCheck). Does nothing while history storage is off.
  history_count_check:
    class: CountCheckJob
    queue: default
    schedule: every day at 4:15am
  # Metadata enrichment (Metadata::Enricher): works through queued, due targets only. Does nothing
  # while METADATA_ENRICHMENT_ENABLED is off or nothing is due.
  metadata_enrichment:
    class: MetadataEnrichJob
    queue: default
    schedule: every 15 minutes
  # Spotify scrobbling (Spotify::Poller): one Recently Played poll per connected account. Does
  # nothing while SPOTIFY_INGESTION_ENABLED is off (docs/spotify-plan.md §10).
  spotify_poll:
    class: SpotifyPollJob
    queue: default
    schedule: <%= ENV.fetch("SPOTIFY_POLL_SCHEDULE", "every 5 minutes") %>
  # ListenBrainz import (Listenbrainz::Poller): one listens poll per connected account. Does nothing
  # while LISTENBRAINZ_INGESTION_ENABLED is off (docs/listenbrainz-spotify-feasibility.md §4.2).
  listenbrainz_poll:
    class: ListenbrainzPollJob
    queue: default
    schedule: <%= ENV.fetch("LISTENBRAINZ_POLL_SCHEDULE", "every 10 minutes") %>
  # Artwork from ListenBrainz's mapping for albums without a release id (Metadata::InferredArtwork):
  # every ListenBrainz user's candidates, then a batch of 25. Does nothing while the flag is off.
  inferred_artwork:
    class: InferredArtworkJob
    queue: default
    schedule: every hour at minute 40
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

# The same entries for a supervised local import (docs/real-import-runbook.md). They run only while
# bin/jobs runs in development with QUEUE_DATABASE_URL set, and do nothing while storage is off.
development:
  import_watchdog:
    class: ImportWatchdogJob
    queue: default
    schedule: every 10 minutes
  history_sync:
    class: SyncScheduleJob
    queue: default
    schedule: <%= ENV.fetch("SYNC_SCHEDULE", "every 30 minutes") %>
  history_count_check:
    class: CountCheckJob
    queue: default
    schedule: every day at 4:15am
  # Metadata enrichment (Metadata::Enricher): works through queued, due targets only. Does nothing
  # while METADATA_ENRICHMENT_ENABLED is off or nothing is due.
  metadata_enrichment:
    class: MetadataEnrichJob
    queue: default
    schedule: every 15 minutes
  # Spotify scrobbling (Spotify::Poller): one Recently Played poll per connected account. Does
  # nothing while SPOTIFY_INGESTION_ENABLED is off (docs/spotify-plan.md §10).
  spotify_poll:
    class: SpotifyPollJob
    queue: default
    schedule: <%= ENV.fetch("SPOTIFY_POLL_SCHEDULE", "every 5 minutes") %>
  # ListenBrainz import (Listenbrainz::Poller): one listens poll per connected account. Does nothing
  # while LISTENBRAINZ_INGESTION_ENABLED is off (docs/listenbrainz-spotify-feasibility.md §4.2).
  listenbrainz_poll:
    class: ListenbrainzPollJob
    queue: default
    schedule: <%= ENV.fetch("LISTENBRAINZ_POLL_SCHEDULE", "every 10 minutes") %>
  # Artwork from ListenBrainz's mapping for albums without a release id (Metadata::InferredArtwork):
  # every ListenBrainz user's candidates, then a batch of 25. Does nothing while the flag is off.
  inferred_artwork:
    class: InferredArtworkJob
    queue: default
    schedule: every hour at minute 40
