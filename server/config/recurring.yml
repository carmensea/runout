# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  # Import recovery: expired leases, abandoned staging, stalled runs (HistoryImport::Recovery).
  # Does nothing that writes history, and schedules no import work while history storage is off.
  import_watchdog:
    class: ImportWatchdogJob
    queue: default
    schedule: every 10 minutes
  # Ongoing synchronisation (HistoryImport::Sync): starts the sync, catch-up or weekly count
  # comparison that is due for each user. How often each is due: config.x.history_sync.
  # Does nothing while history storage is off.
  history_sync:
    class: SyncScheduleJob
    queue: default
    schedule: <%= ENV.fetch("SYNC_SCHEDULE", "every 30 minutes") %>
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
