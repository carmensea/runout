<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#17191A" />
    <script>
      // The chosen theme before the first paint (src/theme/theme.ts owns the rest).
      try {
        var t = localStorage.getItem('runout:theme');
        var c = { moss: '#141d18', 'cotton-candy': '#7b68ee', 'midnight-candy': '#171331', verdant: '#11291f' };
        if (t && c[t]) { document.documentElement.dataset.theme = t; document.querySelector('meta[name="theme-color"]').content = c[t]; }
      } catch (e) {}
    </script>
    <title>Runout</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Schibsted+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Material+Symbols+Sharp:opsz,wght@20..48,300&display=block"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
