name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (tests, lint, security scan)
    # Pinned: ruby/setup-ruby only prebuilds the newest patch of each series on the newest image,
    # and CI should run the same Ruby as server/.ruby-version (3.4.7).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: test
      DATABASE_HOST: localhost
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: server
          bundler-cache: true
      - run: bin/rails db:prepare
      - run: bin/rails test
      - run: bin/rubocop
      - run: bin/brakeman --no-pager --quiet
      - run: bin/bundler-audit

  image:
    name: Production image (build, boot, end-to-end against a fake Spotify and Last.fm)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t runout:smoke .
      - name: The image carries no local secrets, data or test code
        run: docker run --rm --entrypoint sh runout:smoke -c '! ls -a /rails | grep -E "^\.env" && ! find /rails -name "*.dump" | grep . && ! test -e /rails/test && test -f /rails/frontend/index.html'
      - name: With ingestion off, connecting stores no plays
        run: INGESTION=false server/test/smoke/production/run.sh
      - name: Sign-in, OAuth, polling, restarts, deduplication
        run: server/test/smoke/production/run.sh

  schema-restore:
    name: Schema survives a restore (PostgreSQL 18, the backup job's comparison)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: test
      DATABASE_HOST: localhost
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: server
          bundler-cache: true
      # Every migration from scratch, as production ran them; then the backup job's own dump,
      # restore and schema comparison, with PostgreSQL 18 tools inside the service container. A
      # constraint that comes back different from a restore fails the real backup
      # (docs/railway-deployment.md §7, "Schema gotcha"), so it fails here first.
      - run: bin/rails db:create db:migrate
      - run: ../deploy/backup/schema_restore_check.sh ${{ job.services.postgres.id }} runout_test

  backup:
    name: Backup job (PostgreSQL 18, restore, encryption, retention, failures)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: deploy/backup/test.sh

